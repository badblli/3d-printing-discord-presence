[package]
name = "printpresence"
version = "0.2.0"
description = "3D printer progress as Discord Rich Presence"
authors = ["badblli"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "printpresence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-autostart = "2.5.1"
tokio-util = "0.7.20"
async-trait = "0.1.92"
thiserror = "2.0.21"
log = "0.4.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls"] }
x509-parser = "0.18.1"
discord-rich-presence = "1.1.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2.4.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3.27.0"

# Full debug info makes each worktree's target/ ~5 GB; line tables keep backtraces usable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
